name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count commits
        id: commits
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: TOTAL_COMMITS=${{ steps.commits.outputs.count }}
          tags: |
            ghcr.io/newtox/graf-cedric:latest
            ghcr.io/newtox/graf-cedric:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/newtox/graf-cedric.de
          cache-from: type=gha
          cache-to: type=gha,mode=max
