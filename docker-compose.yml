services:
  web:
    image: ghcr.io/newtox/graf-cedric:latest
    container_name: graf-cedric
    restart: unless-stopped
    ports:
      - 127.0.0.1:8091:8080
    env_file:
      - stack.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: ${DB_HOST:-host.docker.internal}
      SESSION_SECURE_COOKIE: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - /docker_volumes/graf-cedric/public:/var/www/html/storage/app/public
